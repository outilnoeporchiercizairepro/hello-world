<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello World</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #10131a;
        color: #f7f8fb;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main { text-align: center; padding: 2rem; }
      h1 { font-size: clamp(3rem, 12vw, 8rem); margin: 0; letter-spacing: -0.06em; }
      p { margin: 1rem 0 0; color: #abb4c4; font-size: 1.125rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Hello, world!</h1>
      <p>Ma première page publiée.</p>
    </main>
  </body>
</html>
